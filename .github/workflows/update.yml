name: 更新榜单
on:
  schedule:
    - cron: "0 8 1 * *"   # 北京时间每月1号 16:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scraper/main.py
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
          git push
      - name: 刷新 jsDelivr 缓存
        run: |
          curl -s https://purge.jsdelivr.net/gh/304584987/novel-rank@main/data/latest.json || true
